lang: it

project:
  type: website
  output-dir: docs
  # link previews: one card per post (made only if missing; needs R packages
  # webshot2 and yaml, and Chrome), then card and text set in each page
  pre-render: _og/make-cards.R
  post-render: og-preview.ts

website:
  title: "toffeeblog"
  # Link previews (WhatsApp, social networks): Open Graph/Twitter tags need
  # an absolute image URL, hence site-url. Posts use their own image and
  # opening paragraph; the description of the home page is in index.qmd.
  site-url: https://enricotoffalini.github.io/blog/
  image: images/social-card.jpg
  image-alt: "toffeeblog, il blog di Enrico Toffalini"
  open-graph:
    locale: it_IT
  twitter-card:
    card-style: summary_large_image
  navbar:
    left: 
      - href: https://enricotoffalini.github.io
        text: "enricotoffalini.github.io"
        target: _blank
    right:
      - href: https://psicostat.dpss.psy.unipd.it/
        text: "<img src='/images/faviconpsicostat2.png' style='height: 22px; margin-top: -4px;'>"
        target: _blank
      - icon: github
        href: https://github.com/EnricoToffalini
        target: _blank

format:
  html:
    include-in-header:
       text: |
          <link rel="shortcut icon" href="favicon.ico"/> 
          <script data-goatcounter="https://toffeeblog.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    theme:
      - cosmo
      - brand
    css: styles.css



